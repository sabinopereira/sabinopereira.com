<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#eee1c9}
  .post{width:1080px;height:1350px;display:grid;grid-template-columns:49% 51%;position:relative;background:#f1e7d6}
  .copy{padding:94px 58px 84px 76px;display:flex;flex-direction:column;position:relative;z-index:2}
  .cross{font:400 42px/1 Georgia,"Times New Roman",serif;color:#8c3026;margin:0 0 34px}
  .kicker{font:600 25px/1.2 Arial,sans-serif;letter-spacing:7px;color:#8c3026;margin:0 0 190px}
  .line{width:58px;height:3px;background:#8c3026;margin-top:24px}
  .message{font:400 54px/1.18 Georgia,"Times New Roman",serif;color:#201a16;letter-spacing:-1.1px;margin:0}
  .message em{font-style:italic;color:#8c3026}
  .brand{margin-top:auto;font:600 18px/1 Arial,sans-serif;letter-spacing:7px;color:#201a16}
  .sub{margin-top:13px;font:italic 17px Georgia,serif;color:#8c3026}
  .photo{position:relative;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:58% center;filter:saturate(.72) contrast(.94) brightness(1.04)}
  .photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(241,231,214,.35),transparent 18%),linear-gradient(0deg,rgba(34,25,18,.13),transparent 38%)}
  .rule{position:absolute;left:49%;top:86px;bottom:86px;width:1px;background:rgba(119,72,42,.25);z-index:3}
</style>
</head>
<body>
<main class="post">
  <section class="copy">
    <div><div class="cross">✝</div><p class="kicker">THIS SUNDAY</p><div class="line"></div></div>
    <p class="message">May God give <em>rest</em><br>to the part of you<br>that has been strong<br>all week</p>
    <div><div class="brand">REIRA BIN</div><div class="sub">Faith &amp; Grace</div></div>
  </section>
  <section class="photo"><img src="pexels-cottonbro-prayer.jpg" alt="Woman praying quietly in a sunlit church"></section>
  <div class="rule"></div>
</main>
</body>
</html>
