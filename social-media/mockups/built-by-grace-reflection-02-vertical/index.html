<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built by Grace Reflection 02 — Vertical Mockup</title>
<style>
  *{box-sizing:border-box}
  html,body{width:1080px;height:1920px;margin:0;overflow:hidden;background:#f8f5ef}
  .frame{position:relative;display:grid;grid-template-columns:1fr 1fr;width:1080px;height:1920px}
  .copy{position:relative;display:flex;flex-direction:column;justify-content:center;padding:148px 70px 154px 78px;background:#fbfaf7;color:#29231e}
  .cross{position:absolute;top:94px;left:78px;color:#986038;font:400 48px/1 Georgia,serif}
  .kicker{margin:0 0 58px;color:#986038;font:700 20px/1.2 Arial,sans-serif;letter-spacing:7px;text-transform:uppercase}
  h1{margin:0;max-width:410px;font:400 69px/1.08 Georgia,"Times New Roman",serif;letter-spacing:-2.3px}
  .rule{width:72px;height:3px;margin:66px 0 29px;background:#986038}
  .brand{font:700 15px/1.35 Arial,sans-serif;letter-spacing:4px;color:#986038;text-transform:uppercase}
  .visual{position:relative;overflow:hidden;background:#a6805d}
  .visual::before{content:"";position:absolute;inset:-45px;background:url('/Users/binopereira/Downloads/built by grace reflections.png') center/cover no-repeat;filter:blur(24px);transform:scale(1.13);opacity:.82}
  .visual::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(58,36,20,.18),transparent 20%,transparent 80%,rgba(52,32,18,.22))}
  .art{position:absolute;z-index:2;left:0;top:50%;width:540px;height:540px;transform:translateY(-50%);object-fit:cover;box-shadow:0 0 70px rgba(45,27,14,.16)}
  .edge{position:absolute;z-index:3;left:0;top:0;bottom:0;width:1px;background:rgba(101,73,48,.25)}
  .series{position:absolute;z-index:4;right:34px;bottom:55px;color:rgba(255,248,237,.88);font:600 13px/1 Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
</style>
</head>
<body>
<main class="frame">
  <section class="copy">
    <div class="cross">†</div>
    <p class="kicker">This Sunday</p>
    <h1>May God return the peace this week tried to take from you</h1>
    <div class="rule"></div>
    <div class="brand">Reira Bin<br>Faith &amp; Grace</div>
  </section>
  <section class="visual">
    <img class="art" src="/Users/binopereira/Downloads/built by grace reflections.png" alt="Built by Grace Reflections">
    <div class="edge"></div>
    <div class="series">Reflection 02</div>
  </section>
</main>
</body>
</html>
