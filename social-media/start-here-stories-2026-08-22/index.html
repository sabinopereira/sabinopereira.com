<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REIRA BIN — Start Here</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
  body{font-family:Georgia,"Times New Roman",serif;color:#171512;background:#efe3cf}
  .page{position:relative;width:1080px;height:1920px;padding:120px 105px 105px;background:
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.55),transparent 34%),
    radial-gradient(circle at 84% 86%,rgba(116,31,24,.08),transparent 28%),
    repeating-linear-gradient(0deg,rgba(65,45,25,.018) 0,rgba(65,45,25,.018) 1px,transparent 1px,transparent 4px),#efe3cf}
  .page:before,.page:after{content:"";position:absolute;background:#80251d;opacity:.9}
  .page:before{width:260px;height:18px;left:-35px;top:245px;transform:rotate(-3deg)}
  .page:after{width:170px;height:11px;right:-25px;bottom:260px;transform:rotate(2deg)}
  .brand{font:600 22px/1 Arial,sans-serif;letter-spacing:9px;text-transform:uppercase}
  .number{position:absolute;right:105px;top:119px;font:italic 21px Georgia;color:#80251d}
  .rule{width:88px;height:3px;background:#80251d;margin-top:28px}
  .center{position:absolute;left:105px;right:105px;top:50%;transform:translateY(-51%)}
  .kicker{font:600 22px/1.3 Arial,sans-serif;letter-spacing:6px;text-transform:uppercase;color:#80251d;margin-bottom:50px}
  h1{font-weight:400;font-size:108px;line-height:.99;letter-spacing:-3px;margin:0 0 42px}
  h1 em{color:#80251d;font-weight:400}
  .lead{font-size:43px;line-height:1.35;max-width:820px;margin:0}
  .small{font:500 22px/1.5 Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#5d554a;margin-top:48px}
  .list{display:grid;gap:25px;margin-top:50px;font-size:48px;line-height:1.2}
  .list div{padding:24px 0;border-bottom:1px solid rgba(23,21,18,.22)}
  .list span{color:#80251d;margin-right:22px}
  .footer{position:absolute;left:105px;right:105px;bottom:94px;display:flex;justify-content:space-between;align-items:center;font:600 18px/1 Arial,sans-serif;letter-spacing:5px;text-transform:uppercase}
  .footer i{font-family:Georgia;font-weight:400;letter-spacing:0;text-transform:none;color:#80251d}
  .cta{display:inline-block;margin-top:70px;padding:27px 54px;border:2px solid #80251d;font:600 23px/1 Arial,sans-serif;letter-spacing:5px;text-transform:uppercase;color:#80251d}
</style>
</head>
<body><main id="app"></main>
<script>
const pages=[
 {k:'Welcome',h:'Welcome to<br><em>REIRA BIN</em>',l:'Music. Books. Original worlds.',s:'One creative universe. Many doors.'},
 {k:'The idea',h:'Where ideas<br>become <em>worlds</em>',l:'Stories become books. Feelings become music. Ideas become experiences.',s:'Original worlds to read, hear and feel.'},
 {k:'Inside the universe',h:'What you’ll<br><em>find here</em>',list:['Original music','Books & stories','Original series','Creative products','Podcasts & conversations']},
 {k:'Choose your world',h:'Read it.<br>Hear it.<br><em>Feel it.</em>',l:'Begin with the world that speaks to you first.',s:'There is no wrong door.'},
 {k:'Enter the universe',h:'Ready to<br><em>explore?</em>',l:'Everything begins at sabinopereira.com',s:'',cta:'EXPLORE'}
];
const p=Math.max(1,Math.min(5,Number(new URLSearchParams(location.search).get('p')||1))); const d=pages[p-1];
document.getElementById('app').innerHTML=`<section class="page"><div class="brand">REIRA BIN</div><div class="number">0${p}</div><div class="rule"></div><div class="center"><div class="kicker">${d.k}</div><h1>${d.h}</h1>${d.l?`<p class="lead">${d.l}</p>`:''}${d.list?`<div class="list">${d.list.map((x,i)=>`<div><span>0${i+1}</span>${x}</div>`).join('')}</div>`:''}${d.cta?`<div class="cta">${d.cta}</div>`:''}${d.s?`<div class="small">${d.s}</div>`:''}</div><div class="footer"><span>START HERE</span><i>Original worlds to read, hear and feel.</i></div></section>`;
</script></body></html>
