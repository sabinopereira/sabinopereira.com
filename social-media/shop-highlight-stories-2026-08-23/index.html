<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REIRA BIN — Shop Highlight</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{font-family:Georgia,"Times New Roman",serif;color:#171512;background:#efe3cf}.page{position:relative;width:1080px;height:1920px;padding:115px 92px 92px;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.58),transparent 34%),radial-gradient(circle at 84% 86%,rgba(116,31,24,.08),transparent 28%),repeating-linear-gradient(0deg,rgba(65,45,25,.018) 0,rgba(65,45,25,.018) 1px,transparent 1px,transparent 4px),#efe3cf}.page:before,.page:after{content:"";position:absolute;background:#80251d;opacity:.9}.page:before{width:230px;height:16px;left:-35px;top:232px;transform:rotate(-3deg)}.page:after{width:150px;height:10px;right:-25px;bottom:250px;transform:rotate(2deg)}.brand{font:600 21px/1 Arial,sans-serif;letter-spacing:9px;text-transform:uppercase}.number{position:absolute;right:92px;top:114px;font:italic 21px Georgia;color:#80251d}.rule{width:82px;height:3px;background:#80251d;margin-top:27px}.footer{position:absolute;left:92px;right:92px;bottom:82px;display:flex;justify-content:space-between;align-items:center;font:600 18px/1 Arial,sans-serif;letter-spacing:5px;text-transform:uppercase}.footer i{font-family:Georgia;font-weight:400;letter-spacing:0;text-transform:none;color:#80251d}.intro,.outro{position:absolute;left:92px;right:92px;top:50%;transform:translateY(-52%)}.kicker{font:600 20px/1.3 Arial,sans-serif;letter-spacing:5px;text-transform:uppercase;color:#80251d;margin-bottom:42px}h1{font-weight:400;font-size:91px;line-height:1.02;letter-spacing:-2px;margin:0 0 36px}h1 em{color:#80251d;font-weight:400}.lead{font-size:39px;line-height:1.38;max-width:850px;margin:0}.small{font:500 21px/1.5 Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#5d554a;margin-top:43px}.shelf{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:70px}.shelf span{min-height:145px;border:1px solid rgba(128,37,29,.45);display:flex;align-items:center;justify-content:center;padding:20px;font:500 18px/1.3 Arial,sans-serif;letter-spacing:3px;text-align:center;text-transform:uppercase;background:rgba(255,255,255,.2)}.product-layout{position:absolute;left:92px;right:92px;top:270px;bottom:170px;display:grid;grid-template-rows:1010px 1fr;gap:54px}.visual{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#d8c7ad}.visual:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(23,21,18,.18)}.visual img{width:100%;height:100%;object-fit:cover}.copy{display:grid;grid-template-columns:1fr 240px;gap:38px;align-items:end;border-top:1px solid rgba(23,21,18,.22);padding-top:42px}.copy h1{font-size:61px;line-height:1.01;margin-bottom:22px}.copy .kicker{font-size:17px;margin-bottom:22px;letter-spacing:4px}.description{font-size:28px;line-height:1.35;margin:0;max-width:630px}.cta{align-self:end;justify-self:end;width:230px;min-height:92px;border:2px solid #80251d;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font:600 18px/1.25 Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#80251d;background:rgba(255,255,255,.16)}.outro .cta{margin-top:68px;width:390px;min-height:104px;justify-self:start}
</style>
</head>
<body><main id="app"></main>
<script>
const pages=[
 {type:'intro',k:'The studio shop',h:'Wear the <em>worlds.</em>',l:'Apparel and objects born from music, stories and independent ideas.',s:'Choose the collection that feels like you.'},
 {type:'product',k:'Love · Honesty · Expression',h:'Love Loudly',l:'Streetwear for people who choose honesty over performance.',img:'../../images/shop/new-arrivals/real-is-rare-mockup.png',cta:'Explore'},
 {type:'product',k:'Calm · Focus · Intention',h:'Quiet Power',l:'Speak less. Move different. Clothing built around quiet confidence.',img:'../../images/shop/quiet-power.png',cta:'Explore'},
 {type:'product',k:'Ocean · Belonging · Portugal',h:'Atlantic Soul',l:'Where Europe meets the Atlantic. A collection shaped by salt air and open horizons.',img:'../../images/shop/atlantic-soul-01.png',cta:'Explore'},
 {type:'product',k:'Luck · Defiance · Streetwear',h:'Bang Bang',l:'Bold pieces for people who would rather make their own luck.',img:'../../images/shop/bang-bang-society.png',cta:'Explore'},
 {type:'product',k:'Saudade · Light · Lisbon',h:'Lisbon Tram',l:'A tribute to the City of Seven Hills and its unmistakable yellow tram.',img:'../../images/shop/lisbon-tram.png',cta:'Explore'},
 {type:'outro',k:'The complete studio shop',h:'Find the piece<br>that belongs to <em>your world.</em>',l:'Music, stories and ideas you can wear.',s:'Explore the complete collection at sabinopereira.com',cta:'Explore the shop'}
];
const p=Math.max(1,Math.min(pages.length,Number(new URLSearchParams(location.search).get('p')||1))),d=pages[p-1];
const shell=c=>`<section class="page"><div class="brand">REIRA BIN</div><div class="number">0${p}</div><div class="rule"></div>${c}<div class="footer"><span>SHOP</span><i>Original worlds to read, hear and feel.</i></div></section>`;
let c='';
if(d.type==='intro')c=`<div class="intro"><div class="kicker">${d.k}</div><h1>${d.h}</h1><p class="lead">${d.l}</p><div class="small">${d.s}</div><div class="shelf"><span>Love Loudly</span><span>Quiet Power</span><span>Atlantic Soul</span><span>Bang Bang</span><span>Lisbon Tram</span><span>More worlds coming</span></div></div>`;
if(d.type==='product')c=`<div class="product-layout"><div class="visual"><img src="${d.img}" alt=""></div><div class="copy"><div><div class="kicker">${d.k}</div><h1>${d.h}</h1><p class="description">${d.l}</p></div><div class="cta">${d.cta}</div></div></div>`;
if(d.type==='outro')c=`<div class="outro"><div class="kicker">${d.k}</div><h1>${d.h}</h1><p class="lead">${d.l}</p><div class="cta">${d.cta}</div><div class="small">${d.s}</div></div>`;
document.getElementById('app').innerHTML=shell(c);
</script></body></html>
