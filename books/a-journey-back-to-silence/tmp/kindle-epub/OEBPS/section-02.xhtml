<body class=""><section class="section"><h1>A Note to the Reader</h1><p>This is a work of reflective literary non-fiction. It offers companionship and questions, not medical or psychological advice. If silence brings forward distress that feels difficult to carry alone, seeking support is an act of care, not a failure of stillness.</p></section></body></html>
